# 私有云存储平台 · 应用配置
# 端口：3001 / 3002 双实例（不对外，Nginx :8080 反代）。部署时 --server.port 覆盖。
server:
  port: 3001
  servlet:
    # 全局 /api 前缀（总纲 §5）
    context-path: /api

spring:
  application:
    name: cloud-server

  # 虚拟线程：I/O 密集的分片流式转发，每请求一个轻量虚拟线程
  threads:
    virtual:
      enabled: true
  mvc:
    formcontent:
      filter:
        enabled: false   # 禁用 FormContentFilter，否则 PUT 二进制分片 body 被消费（EntityTooSmall 根因）

  # 数据库：PostgreSQL 16，仅容器网可达（Compose 服务名 postgres）
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloud}
    username: ${DB_USER:cloud}
    password: ${DB_PASSWORD:cloud}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # Redis 7：会话 / 限流 / 审计异步队列 / 统计缓存
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s

  # 数据库变更一律走 Flyway migration，禁止手工改库（总纲 §5）
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 忽略"低于当前版本且未应用"的迁移校验错误：B 组 V1xxx 号段交付晚于 C 组 V2xxx
    # 时必然触发（如 B 组 V1/V2/V3 晚于 v2003），已应用库跳过即可；
    # 全新库无此校验场景，所有迁移仍按序全量执行。
    ignore-migration-patterns:
      - "*:pending"
      - "*:ignored"

  # JPA（A 组认证模块实体管理；ddl 一律以 Flyway 为准，仅校验）
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # 统一时间口径：ISO 8601（总纲 §5）
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    time-zone: Asia/Shanghai

  # App/EXE 推送更新（依据 App 自动更新方案 §5.3）：上传大小限制调大以容纳 APK（200MB）
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

# Swagger（交付物要求；生产环境按 profile 关闭）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.company.cloud: debug

# A 组认证/用户域配置
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-at-least-32-bytes-long}
    issuer: ${JWT_ISSUER:cloud-server}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:120}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  security:
    max-login-failures: ${SECURITY_MAX_LOGIN_FAILURES:5}
    lock-minutes: ${SECURITY_LOCK_MINUTES:15}
    rate-limit-per-minute: ${SECURITY_RATE_LIMIT_PER_MINUTE:5}
  role:
    default-quota-bytes: ${DEFAULT_QUOTA_BYTES:21474836480}
  # ---- 门户接入（《云平台统一门户》产品侧）----
  # 认证侧：门户 RS256 JWT 验签（cloud-auth · PortalAuthProperties）
  portal:
    auth:
      enabled: ${PORTAL_AUTH_ENABLED:true}
      jwks-url: ${PORTAL_JWKS_URL:http://localhost:3000/.well-known/jwks.json}
      issuer: ${PORTAL_ISSUER:cloud-portal}
      refresh-hours: ${PORTAL_JWKS_REFRESH_HOURS:12}
      refresh-cron: "${PORTAL_JWKS_REFRESH_CRON:0 0 */12 * * *}"
      connect-timeout-ms: ${PORTAL_JWKS_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${PORTAL_JWKS_READ_TIMEOUT_MS:5000}
      shadow-username-prefix: ${PORTAL_SHADOW_USERNAME_PREFIX:portal_}
      shadow-default-quota-bytes: ${PORTAL_SHADOW_DEFAULT_QUOTA_BYTES:21474836480}
      shadow-password-hash: "${PORTAL_SHADOW_PASSWORD_HASH:!portal-shadow-no-local-login}"
    # 产品侧：门户内网接口与出账/对账（cloud-portal · PortalProperties）
    product-code: ${PORTAL_PRODUCT_CODE:storage}
    base-url: ${PORTAL_BASE_URL:http://localhost:3000}
    internal-key: ${PORTAL_INTERNAL_KEY:}
    wallet-deduct-path: ${PORTAL_WALLET_DEDUCT_PATH:/api/internal/wallet/deduct}
    wallet-refund-path: ${PORTAL_WALLET_REFUND_PATH:/api/internal/wallet/refund}
    reconciliation-path: ${PORTAL_RECONCILIATION_PATH:/api/internal/reconciliation/report}
    connect-timeout-ms: ${PORTAL_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${PORTAL_READ_TIMEOUT_MS:10000}
    deduct-retry-delays-ms: ${PORTAL_DEDUCT_RETRY_DELAYS_MS:1000,5000,30000}
    subscribe-grace-days: ${PORTAL_SUBSCRIBE_GRACE_DAYS:7}
    expire-cron: "${PORTAL_EXPIRE_CRON:0 0 4 * * *}"
    reconcile-cron: "${PORTAL_RECONCILE_CRON:0 0 6 * * *}"
    reconcile-retries: ${PORTAL_RECONCILE_RETRIES:3}
    postpaid:
      enabled: ${PORTAL_POSTPAID_ENABLED:false}
      cron: "${PORTAL_POSTPAID_CRON:0 30 5 * * *}"
      batch-size: ${PORTAL_POSTPAID_BATCH_SIZE:200}
  update:
    # 拼 apkUrl 的公网入口（含端口），须与 nginx /downloads/ 对外地址一致
    base-url: ${APP_UPDATE_BASE_URL:https://112.4.135.254:19999}
    # 安装包落盘目录（宿主机 downloads/，与 nginx 挂载一致，见方案 §8）
    download-dir: ${APP_UPDATE_DOWNLOAD_DIR:/cloud/downloads}

# B 组 传输域配置（MinIO 对象存储，本地开发默认，生产用环境变量覆盖）
minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.9.160:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:cloud-files}
  region: ${MINIO_REGION:us-east-1}

upload:
  part-size: 8388608          # 8MB 单片
  max-file-size: 10737418240  # 10GB 上限
  allowed-extensions: ""      # 留空 = 不限制扩展名
  session-ttl-hours: 24       # 会话 24h 过期

download:
  presign-expiry-seconds: 300 # 下载预签名 5 分钟

# C 组 文件管理域配置
recycle:
  # 回收站保留期（天）：超期内容每日凌晨自动物理清理（R-C06）。
  # 注意：回收站列表展示的 expireAt 口径须与此值同步（RecycleItemVO）。
  retention-days: ${RECYCLE_RETENTION_DAYS:30}
  purge:
    cron: "${RECYCLE_PURGE_CRON:0 0 3 * * ?}"   # 每天凌晨 3 点（6 段 Quartz 格式）
    dry-run: ${RECYCLE_PURGE_DRY_RUN:true}      # true=只打印待清理清单不执行；验收核对通过后改 false
    batch-size: ${RECYCLE_PURGE_BATCH_SIZE:200} # 单轮最大处理条数，控制单批事务规模